<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>发文后台</title>
  <style>
    :root{--paper:#fbfbf9;--ink:#151515;--muted:#666662;--line:#deded8;--wash:#f2f2ee;--blue:#31577d;--danger:#9b2c2c;font-family:Inter,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0}.topbar{position:sticky;top:0;z-index:2;display:flex;min-height:70px;padding:14px max(20px,calc((100vw - 1200px)/2));border-bottom:1px solid var(--line);align-items:center;justify-content:space-between;background:rgba(251,251,249,.94);backdrop-filter:blur(12px)}.brand{font-size:18px;font-weight:700;letter-spacing:-.02em}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:12px;font-weight:400;letter-spacing:0}.status{max-width:52%;color:var(--muted);font-size:13px;text-align:right}.shell{display:grid;width:min(1200px,calc(100% - 40px));margin:0 auto;padding:42px 0 72px;grid-template-columns:minmax(0,1fr) minmax(320px,.8fr);gap:38px}.eyebrow{margin:0 0 12px;color:var(--muted);font-size:12px;font-weight:650;letter-spacing:.12em}.intro h1{margin:0;font-size:clamp(32px,4vw,48px);line-height:1.12;letter-spacing:-.03em}.intro p{max-width:680px;margin:14px 0 32px;color:var(--muted);font-size:16px;line-height:1.75}.form{display:grid;gap:18px}.metadata{display:grid;grid-template-columns:1fr 180px;gap:14px}.field{display:grid;gap:8px;color:var(--muted);font-size:13px}.field label{font-weight:600;color:var(--ink)}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}input{min-height:46px;padding:0 14px}textarea{min-height:430px;padding:18px;resize:vertical;font-size:16px;line-height:1.75}.summary-input{min-height:116px}input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(49,87,125,.12)}.hint{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:12px}button{min-height:46px;padding:0 18px;border:1px solid var(--ink);border-radius:999px;cursor:pointer;font-weight:650}button.primary{background:var(--ink);color:#fff}button.primary:hover{background:#333}button:disabled{cursor:not-allowed;opacity:.45}.preview{position:sticky;top:94px;align-self:start;border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}.preview-head{padding:17px 20px;border-bottom:1px solid var(--line);background:var(--wash)}.preview-head b{display:block}.preview-head span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.preview-meta{display:grid;gap:9px;padding:20px;border-bottom:1px solid var(--line);font-size:13px}.preview-meta strong{font-size:14px}.slug{color:var(--blue);overflow-wrap:anywhere}.errors{display:grid;gap:8px;margin:0;padding:0;list-style:none}.errors li{color:var(--danger);font-size:13px;line-height:1.5}.rendered{max-height:58vh;padding:26px 24px;overflow:auto;color:#2b2b29;font-size:16px;line-height:1.78}.rendered h1{margin:0 0 18px;font-size:32px;line-height:1.2;letter-spacing:-.02em}.rendered h2{margin:36px 0 14px;font-size:25px;line-height:1.3}.rendered h3{margin:28px 0 12px;font-size:20px}.rendered p{margin:0 0 16px}.rendered ul,.rendered ol{margin:0 0 16px;padding-left:1.35em}.rendered blockquote{margin:22px 0;padding-left:16px;border-left:2px solid var(--blue);color:#5a5a56}.rendered pre{margin:20px 0;padding:14px;border:1px solid var(--line);overflow:auto;background:var(--wash);font-size:13px;line-height:1.65}.rendered :not(pre)>code{padding:.12em .34em;border-radius:4px;background:var(--wash);font-size:.88em}.rendered strong{font-weight:720}.rendered a{color:var(--blue);text-decoration:underline;text-underline-offset:3px}.empty{color:var(--muted)}.result{padding:14px 16px;border:1px solid #9db6ce;border-radius:12px;background:#f1f7fc;color:#214665;font-size:14px;line-height:1.65}.result a{color:inherit;text-decoration:underline;text-underline-offset:3px}@media(max-width:850px){.shell{grid-template-columns:1fr;padding-top:30px}.preview{position:static}.rendered{max-height:none}.metadata{grid-template-columns:1fr}.status{max-width:60%}}@media(max-width:520px){.shell{width:calc(100% - 32px)}.topbar{padding-inline:16px}.status{font-size:11px}.intro p{font-size:15px}textarea{min-height:360px;padding:15px;font-size:16px}.summary-input{min-height:108px}.preview-head,.preview-meta{padding-inline:16px}.rendered{padding:22px 18px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">张智博 · 发文后台<small>仅在本机运行</small></div><div id="status" class="status">正在加载…</div></header>
  <main class="shell">
    <section>
      <div class="intro"><p class="eyebrow">NEW ARTICLE</p><h1>粘贴文章，然后发布。</h1><p>第一行使用 <code># 标题</code>，其余直接是正文。无需 frontmatter，分类可以自由填写。</p></div>
      <form id="form" class="form">
        <div class="metadata">
          <div class="field"><label for="category">分类</label><input id="category" list="category-list" maxlength="40" placeholder="例如：AI 时间线" required><datalist id="category-list"></datalist></div>
          <div class="field"><label for="date">发布日期</label><input id="date" type="date" required></div>
        </div>
        <div class="field"><label for="summary">文章摘要</label><textarea id="summary" class="summary-input" maxlength="160" placeholder="会先从正文首段自动生成；你可以改成更适合列表和搜索展示的版本。"></textarea><p class="hint">用于文章列表、详情页、搜索结果与 RSS。留空时会自动使用正文首段。</p></div>
        <div class="field"><label for="content">完整文章</label><textarea id="content" spellcheck="true" placeholder="# 文章标题\n\n从这里开始粘贴正文…" required></textarea><p class="hint">正文只保存在你的电脑；点击发布前不会生成文件、提交或推送。</p></div>
        <div class="actions"><button id="publish" class="primary" type="submit" disabled>发布文章</button><span class="hint">发布前会再次确认，并进行检查。</span></div>
      </form>
      <div id="result" hidden></div>
    </section>
    <aside class="preview" aria-live="polite"><div class="preview-head"><b>发布预览</b><span>自动生成的页面信息</span></div><div class="preview-meta"><strong id="preview-title">尚未识别标题</strong><span id="preview-category">未填写分类</span><span id="preview-slug" class="slug">链接将在此显示</span><span id="preview-description">摘要将在此显示</span><ul id="errors" class="errors"></ul></div><article id="rendered" class="rendered"><p class="empty">粘贴文章后，这里会显示阅读预览。</p></article></aside>
  </main>
  <script>
    const elements={form:document.querySelector('#form'),category:document.querySelector('#category'),date:document.querySelector('#date'),summary:document.querySelector('#summary'),content:document.querySelector('#content'),publish:document.querySelector('#publish'),status:document.querySelector('#status'),title:document.querySelector('#preview-title'),previewCategory:document.querySelector('#preview-category'),slug:document.querySelector('#preview-slug'),description:document.querySelector('#preview-description'),errors:document.querySelector('#errors'),rendered:document.querySelector('#rendered'),result:document.querySelector('#result'),list:document.querySelector('#category-list')};
    let latest={errors:['请粘贴文章。']}, timer, summaryEdited=false;
    const escapeHtml=value=>value.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const renderInline=raw=>{let line=escapeHtml(raw);line=line.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');line=line.replace(/`([^`]+)`/g,'<code>$1</code>');line=line.replace(/(\*\*|__)(.+?)\1/g,'<strong>$2</strong>');line=line.replace(/~~(.+?)~~/g,'<s>$1</s>');line=line.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)|(?<!_)_([^_\n]+)_(?!_)/g,(_,a,b)=>`<em>${a||b}</em>`);return line};
    const renderMarkdown=source=>{const lines=source.replace(/^\uFEFF/,'').split(/\r?\n/);let output='',paragraph=[],inCode=false,list=null;const flush=()=>{if(paragraph.length){output+=`<p>${paragraph.map(renderInline).join('<br>')}</p>`;paragraph=[]}};const closeList=()=>{if(list){output+=`</${list}>`;list=null}};for(const raw of lines){if(raw.startsWith('```')){flush();closeList();inCode=!inCode;output+=inCode?'<pre><code>':'</code></pre>';continue}if(inCode){output+=`${escapeHtml(raw)}\n`;continue}const heading=raw.match(/^(#{1,3})\s+(.+)/);if(heading){flush();closeList();output+=`<h${heading[1].length}>${renderInline(heading[2])}</h${heading[1].length}>`;continue}const item=raw.match(/^[-*]\s+(.+)/);const numbered=raw.match(/^\d+\.\s+(.+)/);if(item||numbered){flush();const kind=numbered?'ol':'ul';if(list&&list!==kind){closeList()}if(!list){list=kind;output+=`<${kind}>`}output+=`<li>${renderInline((item||numbered)[1])}</li>`;continue}if(raw.startsWith('> ')){flush();closeList();output+=`<blockquote>${renderInline(raw.slice(2))}</blockquote>`;continue}if(!raw.trim()){flush();closeList();continue}paragraph.push(raw)}flush();closeList();return output||'<p class="empty">粘贴文章后，这里会显示阅读预览。</p>'};
    const payload=()=>({content:elements.content.value,category:elements.category.value,pubDate:elements.date.value,summary:summaryEdited?elements.summary.value:''});
    const display=article=>{latest=article;if(!summaryEdited)elements.summary.value=article.description||'';elements.title.textContent=article.title||'尚未识别标题';elements.previewCategory.textContent=article.category||'未填写分类';elements.slug.textContent=article.slug?`/articles/${article.slug}/`:'链接将在此显示';elements.description.textContent=article.description||'摘要将在此显示';elements.errors.replaceChildren(...article.errors.map(error=>{const li=document.createElement('li');li.textContent=error;return li}));elements.publish.disabled=article.errors.length>0;elements.rendered.innerHTML=renderMarkdown(elements.content.value);elements.status.textContent=article.errors.length?`请处理 ${article.errors.length} 个问题`:'文章已准备好，可以发布';};
    const validate=async()=>{try{const response=await fetch('/api/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});display(await response.json())}catch{elements.status.textContent='无法连接本地发文后台，请重新启动。'}};
    const schedule=()=>{clearTimeout(timer);timer=setTimeout(validate,180)};
    [elements.category,elements.date,elements.content].forEach(input=>input.addEventListener('input',schedule));
    elements.summary.addEventListener('input',()=>{summaryEdited=true;schedule()});
    elements.form.addEventListener('submit',async event=>{event.preventDefault();await validate();if(latest.errors.length)return;if(!confirm(`确认发布《${latest.title}》吗？\n\n系统将构建、提交这一篇文章并推送上线。`))return;elements.publish.disabled=true;elements.status.textContent='正在构建、提交并推送，请勿关闭此页面…';try{const response=await fetch('/api/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});const result=await response.json();if(!response.ok)throw new Error(result.error);elements.status.textContent='已推送，正在由 GitHub Pages 部署。';elements.result.hidden=false;elements.result.className='result';elements.result.innerHTML=`已发布《${escapeHtml(result.title)}》。<br><a href="${result.url}" target="_blank" rel="noreferrer">打开线上文章</a>${result.actionUrl?` · <a href="${result.actionUrl}" target="_blank" rel="noreferrer">查看部署状态</a>`:''}`;elements.content.value='';elements.summary.value='';summaryEdited=false;schedule()}catch(error){elements.status.textContent='发布未完成。';elements.result.hidden=false;elements.result.className='result';elements.result.textContent=error.message}finally{elements.publish.disabled=latest.errors.length>0}});
    (async()=>{try{const response=await fetch('/api/bootstrap');const data=await response.json();elements.date.value=data.date;data.categories.forEach(category=>{const option=document.createElement('option');option.value=category;elements.list.append(option)});elements.status.textContent='本地发文后台已就绪';validate()}catch{elements.status.textContent='无法启动本地发文后台'}})();
  </script>
</body>
</html>
