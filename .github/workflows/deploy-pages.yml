name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source
        run: pnpm check

      - name: Build static site
        run: pnpm build
        env:
          VITE_GITHUB_PAGES: "true"

      - name: Validate generated links
        run: pnpm test:links

      - name: Validate static artifacts
        run: pnpm test:static

      - name: Validate browser experience
        shell: bash
        run: |
          set -o pipefail
          pnpm test:preview 2>&1 | tee preview-validation.log || {
            echo "::error title=Browser preview failed::$(tail -n 25 preview-validation.log | tr '\n' ' ')"
            exit 1
          }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
